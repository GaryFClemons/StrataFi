# Halcyon Coffee Co.'s internal knowledge base, as a StrataFi corpus manifest: an
# invented specialty roaster with 40 cafés, the Fenwick Street roastery and a wholesale business.
# Each entry gives a document's path (relative to this folder), collection, key, version,
# effective dates, title, ACL, source URI and status. Import it with that metadata
# (extract/manifest), e.g. POST /api/v1/documents/import-manifest with root `fixtures` and path
# `demo-corpus/corpus`, or upload this file with the SDK (`client.corpora.upload(..., manifest=)`).
#
# Everything is invented and released under CC0-1.0. The eval set's "today" (as_of) is
# 2026-11-01, and some documents are traps on purpose:
#
# - Superseded: Paid Time Off and Leave v2 (replaced by v3 on 2026-01-01) and Halcyon Rewards v2
#   (replaced by v3 on 2025-09-01) are still in the corpus, with older numbers for the same rules.
# - Future-dated: Halcyon Rewards v4 is approved but takes effect only on 2027-01-01, so v3 is
#   current until then. v4 changes the free-drink threshold, point expiry, the birthday reward,
#   Gold status and the adjustment limit, and adds a reusable-cup bonus that v3 doesn't have.
# - ACL: management/ is readable only by the `managers` group and executive/ (a confidential
#   2027 expansion memo) only by `executives`. The eval set asks the same questions as `staff`,
#   who must get nothing back from those documents.
# - Tables: some answers sit only in a table row (holding times, recipes, the cleaning schedule,
#   wholesale tiers, pay bands, attendance points and policy owners).
tenant: halcyon
documents:
  - {path: handbook/pto-leave-v2.md, collection: handbook, doc_key: pto-leave, version: "2", effective_from: 2024-01-01, effective_to: 2026-01-01, title: Paid Time Off and Leave Policy, acl: {groups: [all-staff], users: []}, source_uri: corpus/handbook/pto-leave-v2.md, status: published, expect: indexed}
  - {path: handbook/pto-leave-v3.md, collection: handbook, doc_key: pto-leave, version: "3", effective_from: 2026-01-01, title: Paid Time Off and Leave Policy, acl: {groups: [all-staff], users: []}, source_uri: corpus/handbook/pto-leave-v3.md, status: published, expect: indexed}
