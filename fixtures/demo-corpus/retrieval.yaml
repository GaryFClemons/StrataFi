# retrieval.yaml: retrieval questions over the Halcyon Coffee Co. corpus (corpus/manifest.yaml),
# in the stratafi.eval-set.v1 retrieval format. Import the corpus with its manifest, then search
# each query as its asker (the `askers` table below: groups are what document ACLs are checked
# against) with "today" = as_of and top_k = k.
#
# - expected: gold evidence. A result is a hit when it comes from an expected doc_key and version
#   and its section matches, or its text contains the evidence phrase. Each phrase is a verbatim
#   substring (at most 100 characters) of that section's own text.
# - avoid: superseded or not-yet-effective versions that must not rank above the first hit.
# - must_not_return: documents that must never come back for that asker on that day (ACL copies
#   suffixed --as-staff / --as-manager, and the future-dated Rewards v4).
# - expected: [] means no current document answers the question (abstention). near_misses lists
#   the closest passages, which a good answer cites while saying the policy doesn't cover it.
#
# Item IDs start with their type: lookup-, scenario-, table-, version-, acl-, abstain-. Check the
# set with `uv run --no-sync python fixtures/demo-corpus/check_eval_set.py`. Everything is
# invented and released under CC0-1.0.
tenant: halcyon
description: 'Halcyon Coffee Co. demo corpus: staff questions with gold sections, version traps, ACL checks and abstentions. Everything is invented (CC0-1.0).'
as_of: '2026-11-01'
k: 5
askers:
  staff:
    roles:
    - staff
    groups:
    - all-staff
  manager:
    roles:
    - manager
    groups:
    - all-staff
    - managers
  exec:
    roles:
    - exec
    groups:
    - all-staff
    - managers
    - executives
