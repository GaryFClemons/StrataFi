[project]
name = "stratafi-api"
version = "0.1.0"
description = "Stratafi's REST API with server-sent events and identity modes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "stratafi-components",
    "stratafi-core",
    "stratafi-store",
    "fastapi>=0.115",
    "python-multipart>=0.0.20",
    "uvicorn>=0.32",
]

[project.scripts]
stratafi-api = "stratafi_api.main:main"

[tool.uv.sources]
stratafi-components = { workspace = true }
stratafi-core = { workspace = true }
stratafi-store = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stratafi_api"]
