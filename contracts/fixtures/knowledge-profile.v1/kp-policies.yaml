# stratafi.knowledge-profile.v1: kp-policies
schema: stratafi.knowledge-profile.v1
name: kp-policies
description: Fixed 256-token chunks for the Halcyon handbook
pipeline:
  schema: stratafi.pipeline.v1
  name: baseline-v1.x3f2a9c1d07
  description: 'An experiment''s variant of baseline-v1 v1: stages.chunk.component,
    stages.chunk.params'
  stages:
    extract:
      component:
        component: extract/upload
        params: {}
      unpack:
      - component: unpack/zip
        params:
          max_entries: 10000
          max_expanded_bytes: 536870912
          max_ratio: 100
    scan:
      checks:
      - component: scan/content-safety
        params:
          max_bytes: 268435456
          max_pages: 2000
          unknown_types: allow
      - component: scan/clamav
        params:
          max_signature_age_hours: 72
          timeout_seconds: 30.0
      - component: scan/dedupe
        params: {}
      on_outcome:
        infected: exclude
        encrypted: exclude
        malformed: exclude
        limit_exceeded: exclude
        pii: exclude
        error: exclude
        duplicate: exclude
    parse:
      route:
        default:
          component: parse/markdown
          params: {}
    clean:
    - component: clean/whitespace
      params:
        paragraphs: keep
    chunk:
      component: chunk/fixed-tokens
      params:
        size: 256
        overlap: 32
        token_estimator: chars/4
      index_text: '{title}

        {heading_path}

        {text}'
    enrich:
      component: enrich/none
      params: {}
    embed:
      component: embed/gateway
      params:
        batch_size: 32
        normalize: false
        document_prefix: ''
        query_prefix: ''
        alias: embed-local
    index:
      dense:
        component: index/exact
        params:
          metric: cosine
      keyword:
        component: index/bm25
        params:
          k1: 1.2
          b: 0.75
retrieval:
  schema: stratafi.retrieval.v1
  name: hybrid-v1
  description: ''
  retrievers:
    dense:
      top_n: 50
    keyword:
      top_n: 50
  fusion:
    method: rrf
    k: 60
    alpha: 0.5
  candidates: 50
  filters:
    current_only: true
  rerank:
    component: rerank/gateway
    params:
      alias: rerank-default
  top_k: 8
