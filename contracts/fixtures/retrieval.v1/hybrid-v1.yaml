# Hybrid search: BM25 + exact cosine, reciprocal rank fusion with
# k = 60 over 50 candidates, a gateway reranker, top 8, current versions only.
schema: stratafi.retrieval.v1
name: hybrid-v1
retrievers: {dense: {top_n: 50}, keyword: {top_n: 50}}
fusion: {method: rrf, k: 60}
candidates: 50
filters: {current_only: true}
rerank: {component: rerank/gateway, params: {alias: rerank-default}}
top_k: 8
