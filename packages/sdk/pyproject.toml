[project]
name = "stratafi"
version = "0.1.0"
description = "The Stratafi Python SDK and the `stratafi` command line."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# A client of the API only: it never imports the other Stratafi packages.
dependencies = [
    "httpx2>=2.16",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# `.to_frame()` returns pandas DataFrames.
frames = ["pandas>=2.2"]

[project.scripts]
stratafi = "stratafi.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stratafi"]
